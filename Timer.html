
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Timer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .timer-box {
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 320px;
      max-width: calc(100vw - 80px);
    }

    h1 { color: #38bdf8; }

    .inputs {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .inputs input {
      width: 65px;
      padding: 10px 2px;
      text-align: center;
      border-radius: 8px;
      border: none;
      font-size: 18px;
    }

    .inputs label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
    }

    #display {
      font-size: clamp(35px, 10vw, 48px);
      font-weight: bold;
      margin: 25px 0;
      font-variant-numeric: tabular-nums;
    }

    button {
      padding: 11px;
      margin: 4px 2px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .start { background: #22c55e; }
    .pause { background: #facc15; }
    .reset { background: #f87171; }

    #message { color: #38bdf8; }
  </style>
</head>

<body>
  <div class="timer-box">
    <h1>⏱️ My Timer</h1>

    <div class="inputs">
      <div>
        <label for="hours">Hours</label>
        <input type="number" id="hours" min="0" max="999" value="0">
      </div>
      <div>
        <label for="minutes">Minutes</label>
        <input type="number" id="minutes" min="0" max="59" value="1">
      </div>
      <div>
        <label for="seconds">Seconds</label>
        <input type="number" id="seconds" min="0" max="59" value="0">
      </div>
    </div>

    <div id="display">00:01:00</div>

    <button class="start" id="start">▶ Start</button>
    <button class="pause" id="pause">⏸ Pause</button>
    <button class="reset" id="reset">↻ Reset</button>

    <p id="message">Ready to start!</p>
  </div>

  <script>
    const hoursInput = document.getElementById("hours");
    const minutesInput = document.getElementById("minutes");
    const secondsInput = document.getElementById("seconds");
    const display = document.getElementById("display");
    const message = document.getElementById("message");

    let remaining = 60;
    let interval = null;
    let endTime = null;

    function showTime() {
      const h = Math.floor(remaining / 3600);
      const m = Math.floor((remaining % 3600) / 60);
      const s = remaining % 60;

      display.textContent =
        String(h).padStart(2, "0") + ":" +
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0");
    }

    function getInputTime() {
      const h = Number(hoursInput.value);
      const m = Number(minutesInput.value);
      const s = Number(secondsInput.value);

      if (
        hoursInput.value.trim() === "" ||
        minutesInput.value.trim() === "" ||
        secondsInput.value.trim() === "" ||
        !Number.isInteger(h) || h < 0 || h > 999 ||
        !Number.isInteger(m) || m < 0 || m > 59 ||
        !Number.isInteger(s) || s < 0 || s > 59
      ) {
        return null;
      }

      return h * 3600 + m * 60 + s;
    }

    function startTimer() {
      if (interval !== null) return;

      if (remaining <= 0) {
        const inputTime = getInputTime();

        if (inputTime === null || inputTime <= 0) {
          message.textContent = "Enter a valid time above zero!";
          return;
        }

        remaining = inputTime;
      }

      endTime = Date.now() + remaining * 1000;
      message.textContent = "Timer running!";

      interval = setInterval(() => {
        remaining = Math.max(
          0,
          Math.ceil((endTime - Date.now()) / 1000)
        );

        showTime();

        if (remaining === 0) {
          clearInterval(interval);
          interval = null;
          endTime = null;
          message.textContent = "🎉 Time is up!";
          alert("⏰ Time is up!");
        }
      }, 200);
    }

    function pauseTimer() {
      if (interval === null) return;

      remaining = Math.max(
        0,
        Math.ceil((endTime - Date.now()) / 1000)
      );

      clearInterval(interval);
      interval = null;
      endTime = null;
      showTime();
      message.textContent = "Timer paused.";
    }

    function resetTimer() {
      clearInterval(interval);
      interval = null;
      endTime = null;

      const inputTime = getInputTime();
      remaining = inputTime === null ? 0 : inputTime;

      showTime();
      message.textContent = "Ready to start!";
    }

    document.getElementById("start").addEventListener("click", startTimer);
    document.getElementById("pause").addEventListener("click", pauseTimer);
    document.getElementById("reset").addEventListener("click", resetTimer);

    [hoursInput, minutesInput, secondsInput].forEach(input => {
      input.addEventListener("input", resetTimer);
    });

    showTime();
  </script>
</body>
</html>
